<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>
        SplitXpence - Register
    </title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>

<div class="auth-page">

    <div class="auth-container">

        <div class="auth-brand">

            <h1>SplitXpence</h1>

            <p>
                Share expenses. Track balances. Settle easily.
            </p>

        </div>


        <div class="auth-card">

            <h2>Create Account</h2>

            <p class="auth-subtitle">
                Register to start managing shared expenses.
            </p>


            <div id="message"
                 class="message">
            </div>


            <form id="registerForm">

                <div class="form-group">

                    <label>Name</label>

                    <input type="text"
                           id="name"
                           required>

                </div>


                <div class="form-group">

                    <label>Email</label>

                    <input type="email"
                           id="email"
                           required>

                </div>


                <div class="form-group">

                    <label>Password</label>

                    <input type="password"
                           id="password"
                           minlength="4"
                           required>

                </div>


                <button type="submit">
                    Create Account
                </button>

            </form>


            <div class="auth-footer">

                Already have an account?

                <a href="/login.html">
                    Login
                </a>

            </div>

        </div>

    </div>

</div>


<script>

document.getElementById(
    "registerForm"
).addEventListener(
    "submit",
    function(event) {

        event.preventDefault();

        const data =
            new URLSearchParams();

        data.append(
            "name",
            document.getElementById(
                "name"
            ).value
        );

        data.append(
            "email",
            document.getElementById(
                "email"
            ).value
        );

        data.append(
            "password",
            document.getElementById(
                "password"
            ).value
        );


        fetch(
            "/register",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/x-www-form-urlencoded"
                },

                body: data
            }
        )

            .then(response =>
                response.text()
            )

            .then(result => {

                const message =
                    document.getElementById(
                        "message"
                    );


                if (result.includes(
                    "successfully"
                )) {

                    message.innerText =
                        result
                        + ". Redirecting to login...";

                    message.className =
                        "message message-success";

                    message.style.display =
                        "block";


                    setTimeout(
                        function() {

                            window.location.href =
                                "/login.html";

                        },
                        1200
                    );

                    return;
                }


                message.innerText =
                    result;

                message.className =
                    "message message-error";

                message.style.display =
                    "block";

            });

    }
);

</script>

</body>

</html>
