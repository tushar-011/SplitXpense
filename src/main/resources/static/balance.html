<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>
        SplitXpence - Balances
    </title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>

<header>

    <h1>SplitXpence</h1>

    <nav>
        <a href="/dashboard.html">Dashboard</a>
        <a href="/groups.html">Groups</a>
        <a href="/add-expense.html">Expenses</a>
        <a href="/balance.html">Balances</a>
        <a href="/settlement.html">Settlements</a>
        <a href="/reports.html">Reports</a>
        <a href="/profile.html">Profile</a>
        <a href="/logout">Logout</a>
    </nav>

</header>


<div class="container">

    <div class="page-title">

        <h2>Balance Management</h2>

        <p>
            Review group balances and outstanding payments.
        </p>

    </div>


    <div class="card">

        <div class="card-header">
            <h3>Select Group</h3>
        </div>


        <div class="form-group">

            <label>Group</label>

            <select id="groupSelect">
            </select>

        </div>

    </div>


    <div class="card">

        <div class="card-header">
            <h3>Balance Actions</h3>
        </div>


        <div class="button-row">

            <button onclick="showGroupBalance()">
                Group Balance
            </button>

            <button onclick="showMyBalance()">
                My Balance
            </button>

            <button onclick="showWhoOwes()">
                Who Owes Whom
            </button>

        </div>

    </div>

</div>


<script src="/js/app.js"></script>


<script>

const groupSelect =
    document.getElementById(
        "groupSelect"
    );

const selectedGroup =
    localStorage.getItem(
        "selectedGroupId"
    );


fetch("/groups")

    .then(response =>
        response.json()
    )

    .then(groups => {

        groups.forEach(group => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                group.id;

            option.textContent =
                group.name
                + " (ID: "
                + group.id
                + ")";


            if (String(group.id)
                    === selectedGroup) {

                option.selected =
                    true;
            }


            groupSelect.appendChild(
                option
            );

        });

    });


function saveGroup() {

    localStorage.setItem(
        "selectedGroupId",
        groupSelect.value
    );

}


function showGroupBalance() {

    saveGroup();

    fetchAndShow(
        "/group-balance?groupId="
        + groupSelect.value,

        "Group Balance"
    );
}


function showMyBalance() {

    saveGroup();

    fetchAndShow(
        "/my-balance?groupId="
        + groupSelect.value,

        "My Balance"
    );
}


function showWhoOwes() {

    saveGroup();

    fetchAndShow(
        "/who-owes-whom?groupId="
        + groupSelect.value,

        "Who Owes Whom"
    );
}

</script>

</body>

</html>
