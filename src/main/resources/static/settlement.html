<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <title>
        SplitXpence - Settlements
    </title>

</head>

<body>

    <h1>SplitXpence</h1>

    <h2>Record Settlement</h2>

    <form action="/record-settlement" method="post">

        <label>Group ID:</label>

        <input
            type="number"
            name="groupId"
            required>

        <br><br>

        <label>Paid From (Email):</label>

        <input
            type="email"
            name="fromEmail"
            required>

        <br><br>

        <label>Paid To (Email):</label>

        <input
            type="email"
            name="toEmail"
            required>

        <br><br>

        <label>Amount:</label>

        <input
            type="number"
            name="amount"
            step="0.01"
            min="0.01"
            required>

        <br><br>

        <label>Date:</label>

        <input
            type="date"
            name="settlementDate"
            required>

        <br><br>

        <button type="submit">
            Record Settlement
        </button>

    </form>


    <hr>


    <h2>Settlement History</h2>

    <form action="/settlement-history" method="get">

        <label>Group ID:</label>

        <input
            type="number"
            name="groupId"
            required>

        <button type="submit">
            View History
        </button>

    </form>


    <hr>


    <a href="/balance.html">
        View Balances
    </a>

</body>

</html>
