<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>
        SplitXpence - Settlements
    </title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>

<header>

    <h1>SplitXpence</h1>

    <nav>
        <a href="/dashboard.html">Dashboard</a>
        <a href="/groups.html">Groups</a>
        <a href="/add-expense.html">Expenses</a>
        <a href="/balance.html">Balances</a>
        <a href="/settlement.html">Settlements</a>
        <a href="/reports.html">Reports</a>
        <a href="/profile.html">Profile</a>
        <a href="/logout">Logout</a>
    </nav>

</header>


<div class="container">

    <div class="page-title">

        <h2>Settlements</h2>

        <p>
            Record payments and view settlement history.
        </p>

    </div>


    <div class="card">

        <div class="card-header">
            <h3>Record Settlement</h3>
        </div>


        <form id="settlementForm"
              action="/record-settlement"
              method="post">

            <div class="form-group">

                <label>Group</label>

                <select name="groupId"
                        id="settlementGroup"
                        required>
                </select>

            </div>


            <div class="form-grid">

                <div class="form-group">

                    <label>Paid From</label>

                    <input type="email"
                           name="fromEmail"
                           required>

                </div>


                <div class="form-group">

                    <label>Paid To</label>

                    <input type="email"
                           name="toEmail"
                           required>

                </div>

            </div>


            <div class="form-grid">

                <div class="form-group">

                    <label>Amount</label>

                    <input type="number"
                           name="amount"
                           min="0.01"
                           step="0.01"
                           required>

                </div>


                <div class="form-group">

                    <label>Date</label>

                    <input type="date"
                           name="settlementDate"
                           required>

                </div>

            </div>


            <button type="submit">
                Record Settlement
            </button>

        </form>

    </div>


    <div class="card">

        <div class="card-header">
            <h3>Settlement History</h3>
        </div>


        <form id="historyForm"
              action="/settlement-history"
              method="get">

            <div class="form-group">

                <label>Group</label>

                <select name="groupId"
                        id="historyGroup"
                        required>
                </select>

            </div>


            <button type="submit">
                View History
            </button>

        </form>

    </div>

</div>


<script src="/js/app.js"></script>


<script>

const selectedGroup =
    localStorage.getItem(
        "selectedGroupId"
    );


fetch("/groups")

    .then(response =>
        response.json()
    )

    .then(groups => {

        const dropdowns = [

            document.getElementById(
                "settlementGroup"
            ),

            document.getElementById(
                "historyGroup"
            )

        ];


        groups.forEach(group => {

            dropdowns.forEach(
                dropdown => {

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        group.id;

                    option.textContent =
                        group.name
                        + " (ID: "
                        + group.id
                        + ")";

                    if (
                        String(group.id)
                        === selectedGroup
                    ) {

                        option.selected =
                            true;
                    }

                    dropdown.appendChild(
                        option
                    );

                });

        });

    });


document.getElementById(
    "settlementForm"
).addEventListener(
    "submit",
    function(event) {

        event.preventDefault();

        submitFormAndShow(
            this,
            "Record Settlement"
        );
    }
);


document.getElementById(
    "historyForm"
).addEventListener(
    "submit",
    function(event) {

        event.preventDefault();

        const query =
            new URLSearchParams(
                new FormData(this)
            ).toString();

        fetchAndShow(
            this.action
            + "?"
            + query,

            "Settlement History"
        );

    }
);

</script>

</body>

</html>
