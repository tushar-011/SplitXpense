<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>SplitXpence - Expenses</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<header>

    <h1>SplitXpence</h1>

    <nav>
        <a href="/dashboard.html">Dashboard</a>
        <a href="/groups.html">Groups</a>
        <a href="/add-expense.html">Expenses</a>
        <a href="/balance.html">Balances</a>
        <a href="/settlement.html">Settlements</a>
        <a href="/reports.html">Reports</a>
        <a href="/profile.html">Profile</a>
        <a href="/logout">Logout</a>
    </nav>

</header>

<div class="container">

    <div class="page-title">
        <h2>Expense Management</h2>
        <p>Add, view, search, edit and delete expenses.</p>
    </div>

    <div class="card">

        <div class="card-header">
            <h3>Add Expense</h3>
        </div>

        <form id="addExpenseForm"
              action="/add-expense"
              method="post">

            <div class="form-group">

                <label>Group</label>

                <select name="groupId"
                        id="addGroup"
                        required>
                </select>

            </div>

            <div class="form-grid">

                <div class="form-group">
                    <label>Title</label>

                    <input type="text"
                           name="title"
                           required>
                </div>

                <div class="form-group">
                    <label>Amount</label>

                    <input type="number"
                           name="amount"
                           min="0.01"
                           step="0.01"
                           required>
                </div>

            </div>

            <div class="form-grid">

                <div class="form-group">
                    <label>Date</label>

                    <input type="date"
                           name="expenseDate"
                           required>
                </div>

                <div class="form-group">

                    <label>Category</label>

                    <select name="category"
                            required>

                        <option value="Food">Food</option>
                        <option value="Travel">Travel</option>
                        <option value="Rent">Rent</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Other">Other</option>

                    </select>

                </div>

            </div>

            <div class="form-group">

                <label>Paid By - Email</label>

                <input type="email"
                       name="payerEmail"
                       required>

            </div>

            <div class="form-group">

                <label>
                    Participants
                </label>

                <input type="text"
                       name="participantEmails"
                       placeholder="user1@mail.com, user2@mail.com"
                       required>

            </div>

            <button type="submit">
                Add Expense
            </button>

        </form>

    </div>

    <div class="card">

        <div class="card-header">
            <h3>Search & Filter</h3>
        </div>

        <form id="searchForm"
              action="/search-expenses"
              method="get">

            <div class="form-group">

                <label>Group</label>

                <select name="groupId"
                        id="searchGroup">

                    <option value="">
                        All Groups
                    </option>

                </select>

            </div>

            <div class="form-grid">

                <div class="form-group">
                    <label>Title</label>

                    <input type="text"
                           name="title">
                </div>

                <div class="form-group">

                    <label>Category</label>

                    <select name="category">

                        <option value="">
                            All Categories
                        </option>

                        <option value="Food">Food</option>
                        <option value="Travel">Travel</option>
                        <option value="Rent">Rent</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Other">Other</option>

                    </select>

                </div>

            </div>

            <div class="form-grid">

                <div class="form-group">
                    <label>Start Date</label>
                    <input type="date"
                           name="startDate">
                </div>

                <div class="form-group">
                    <label>End Date</label>
                    <input type="date"
                           name="endDate">
                </div>

            </div>

            <button type="submit">
                Search
            </button>

        </form>

    </div>

    <div class="card">

        <div class="card-header">
            <h3>View Group Expenses</h3>
        </div>

        <form id="viewForm"
              action="/expenses"
              method="get">

            <div class="form-group">

                <label>Group</label>

                <select name="groupId"
                        id="viewGroup"
                        required>
                </select>

            </div>

            <button type="submit">
                View Expenses
            </button>

        </form>

    </div>

    <div class="card">

        <div class="card-header">
            <h3>View Expense Split</h3>
        </div>

        <form id="splitForm"
              action="/expense-splits"
              method="get">

            <div class="form-group">

                <label>Expense ID</label>

                <input type="number"
                       name="expenseId"
                       required>

            </div>

            <button type="submit">
                View Split
            </button>

        </form>

    </div>

    <div class="card">

        <div class="card-header">
            <h3>Edit Expense</h3>
        </div>

        <form id="editForm"
              action="/edit-expense"
              method="post">

            <div class="form-group">

                <label>Expense ID</label>

                <input type="number"
                       name="expenseId"
                       required>

            </div>

            <div class="form-grid">

                <div class="form-group">

                    <label>Title</label>

                    <input type="text"
                           name="title"
                           required>

                </div>

                <div class="form-group">

                    <label>Amount</label>

                    <input type="number"
                           name="amount"
                           step="0.01"
                           required>

                </div>

            </div>

            <div class="form-grid">

                <div class="form-group">

                    <label>Date</label>

                    <input type="date"
                           name="expenseDate"
                           required>

                </div>

                <div class="form-group">

                    <label>Category</label>

                    <select name="category"
                            required>

                        <option value="Food">Food</option>
                        <option value="Travel">Travel</option>
                        <option value="Rent">Rent</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Other">Other</option>

                    </select>

                </div>

            </div>

            <button type="submit">
                Update Expense
            </button>

        </form>

    </div>

    <div class="card">

        <div class="card-header">
            <h3>Delete Expense</h3>
        </div>

        <form id="deleteForm"
              action="/delete-expense"
              method="post">

            <div class="form-group">

                <label>Expense ID</label>

                <input type="number"
                       name="expenseId"
                       required>

            </div>

            <button class="button-danger"
                    type="submit">

                Delete Expense

            </button>

        </form>

    </div>

</div>


<script src="/js/app.js"></script>


<script>

const selectedGroup =
    localStorage.getItem(
        "selectedGroupId"
    );


function loadGroups() {

    fetch("/groups")

        .then(response =>
            response.json()
        )

        .then(groups => {

            const addGroup =
                document.getElementById(
                    "addGroup"
                );

            const searchGroup =
                document.getElementById(
                    "searchGroup"
                );

            const viewGroup =
                document.getElementById(
                    "viewGroup"
                );


            groups.forEach(group => {

                [addGroup, searchGroup, viewGroup]
                    .forEach(dropdown => {

                        const option =
                            document.createElement(
                                "option"
                            );

                        option.value =
                            group.id;

                        option.textContent =
                            group.name
                            + " (ID: "
                            + group.id
                            + ")";

                        if (
                            String(group.id)
                            === selectedGroup
                        ) {

                            option.selected =
                                true;
                        }

                        dropdown.appendChild(
                            option
                        );

                    });

            });

        });

}


function setupPostForm(
        id,
        title) {

    document.getElementById(id)
        .addEventListener(
            "submit",
            function(event) {

                event.preventDefault();

                submitFormAndShow(
                    this,
                    title
                );
            }
        );
}


function setupGetForm(
        id,
        title) {

    document.getElementById(id)
        .addEventListener(
            "submit",
            function(event) {

                event.preventDefault();

                const query =
                    new URLSearchParams(
                        new FormData(this)
                    ).toString();

                fetchAndShow(
                    this.action
                    + "?"
                    + query,
                    title
                );
            }
        );
}


setupPostForm(
    "addExpenseForm",
    "Add Expense"
);

setupGetForm(
    "searchForm",
    "Search Results"
);

setupGetForm(
    "viewForm",
    "Group Expenses"
);

setupGetForm(
    "splitForm",
    "Expense Split"
);

setupPostForm(
    "editForm",
    "Edit Expense"
);

setupPostForm(
    "deleteForm",
    "Delete Expense"
);


loadGroups();

</script>

</body>
</html>
