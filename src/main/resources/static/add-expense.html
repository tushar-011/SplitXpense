<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SplitXpence - Add Expense</title>
</head>

<body>

    <h1>SplitXpence</h1>
    <h2>Add Expense</h2>

    <form action="/add-expense" method="post">

        <label>Group ID:</label>
        <input type="number" name="groupId" required>

        <br><br>

        <label>Expense Title:</label>
        <input type="text" name="title" required>

        <br><br>

        <label>Amount:</label>
        <input type="number"
               name="amount"
               step="0.01"
               required>

        <br><br>

        <label>Date:</label>
        <input type="date"
               name="expenseDate"
               required>

        <br><br>

        <label>Category:</label>

        <select name="category" required>
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Rent">Rent</option>
            <option value="Shopping">Shopping</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
        </select>

        <br><br>

        <label>Paid By (Email):</label>
        <input type="email"
               name="payerEmail"
               required>

        <br><br>

        <button type="submit">
            Add Expense
        </button>

    </form>

    <br><br>

    <h2>View Group Expenses</h2>

    <form action="/expenses" method="get">

        <label>Group ID:</label>
        <input type="number"
               name="groupId"
               required>

        <button type="submit">
            View Expenses
        </button>

        <hr>

        <h2>Edit Expense</h2>

        <form action="/edit-expense" method="post">

            <label>Expense ID:</label>
            <input type="number" name="expenseId" required>

            <br><br>

            <label>Title:</label>
            <input type="text" name="title" required>

            <br><br>

            <label>Amount:</label>
            <input type="number" name="amount" step="0.01" required>

            <br><br>

            <label>Date:</label>
            <input type="date" name="expenseDate" required>

            <br><br>

            <label>Category:</label>

            <select name="category" required>
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Rent">Rent</option>
                <option value="Shopping">Shopping</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
            </select>

            <br><br>

            <button type="submit">
                Update Expense
            </button>

        </form>

        <hr>

        <h2>Delete Expense</h2>

        <form action="/delete-expense" method="post">

            <label>Expense ID:</label>
            <input type="number" name="expenseId" required>

            <button type="submit">
                Delete Expense
            </button>


    </form>

</body>
</html>
