<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>
        SplitXpence - Login
    </title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>

<div class="auth-page">

    <div class="auth-container">

        <div class="auth-brand">

            <h1>SplitXpence</h1>

            <p>
                Simple group expense management
            </p>

        </div>


        <div class="auth-card">

            <h2>Login</h2>

            <p class="auth-subtitle">
                Sign in to access your groups and expenses.
            </p>


            <div id="message"
                 class="message">
            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label>Email</label>

                    <input type="email"
                           id="email"
                           required>

                </div>


                <div class="form-group">

                    <label>Password</label>

                    <input type="password"
                           id="password"
                           required>

                </div>


                <button type="submit">
                    Login
                </button>

            </form>


            <div class="auth-footer">

                Don't have an account?

                <a href="/register.html">
                    Create Account
                </a>

            </div>

        </div>

    </div>

</div>


<script>

document.getElementById(
    "loginForm"
).addEventListener(
    "submit",
    function(event) {

        event.preventDefault();

        const data =
            new URLSearchParams();

        data.append(
            "email",
            document.getElementById(
                "email"
            ).value
        );

        data.append(
            "password",
            document.getElementById(
                "password"
            ).value
        );


        fetch(
            "/login",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/x-www-form-urlencoded"
                },

                body: data
            }
        )

            .then(response =>
                response.text()
            )

            .then(result => {

                if (result.includes(
                    "Login successful"
                )) {

                    window.location.href =
                        "/dashboard.html";

                    return;
                }


                const message =
                    document.getElementById(
                        "message"
                    );

                message.innerText =
                    result;

                message.className =
                    "message message-error";

                message.style.display =
                    "block";

            });

    }
);

</script>

</body>

</html>
