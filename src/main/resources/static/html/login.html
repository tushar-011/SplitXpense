<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>SplitXpence - Login</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="auth-page">

    <div class="auth-container">

        <div class="auth-brand">

            <h1>💸 SplitXpence</h1>

            <p>
                Split bills. Save friendships. Stay unbothered. ✨
            </p>

        </div>

        <div class="auth-card">

            <h2>Welcome back 👋</h2>

            <p class="auth-subtitle">
                Login and see who's still owing you money 👀
            </p>

            <div id="message"
                 class="message">
            </div>

            <form id="loginForm">

                <div class="form-group">

                    <label>📧 Email</label>

                    <input type="email"
                           id="email"
                           placeholder="you@mail.com"
                           required>

                </div>

                <div class="form-group">

                    <label>🔐 Password</label>

                    <input type="password"
                           id="password"
                           placeholder="••••••••"
                           required>

                </div>

                <button type="submit">
                    🚀 Login
                </button>

            </form>

            <div class="auth-footer">

                New here?

                <a href="/html/register.html">
                    Create your account ✨
                </a>

            </div>

        </div>

    </div>

</div>

<script>

document.getElementById(
    "loginForm"
).addEventListener(
    "submit",
    function(event) {

        event.preventDefault();

        const data =
            new URLSearchParams();

        data.append(
            "email",
            document.getElementById("email").value
        );

        data.append(
            "password",
            document.getElementById("password").value
        );

        fetch(
            "/login",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/x-www-form-urlencoded"
                },

                body: data
            }
        )

            .then(response => response.text())

            .then(result => {

                if (
                    result.includes(
                        "Login successful"
                    )
                ) {

                    window.location.href =
                        "/html/dashboard.html";

                    return;
                }

                const message =
                    document.getElementById(
                        "message"
                    );

                message.innerText =
                    result;

                message.className =
                    "message message-error";

                message.style.display =
                    "block";

            });

    }
);

</script>

</body>
</html>
