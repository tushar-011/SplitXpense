<body>

    <h1>SplitXpence</h1>

    <h2>Create Group</h2>

    <form action="/create-group" method="post">

        <label>Group Name:</label>
        <input type="text" name="name" required>

        <br><br>

        <label>Description:</label>

        <br><br>

    </form>

    <br><br>

    <a href="/logout">Logout</a>
