<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>SplitXpence - Members</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<header>

    <h1>💸 SplitXpence</h1>

    <nav>
        <a href="/html/dashboard.html">🏠 Dashboard</a>
        <a href="/html/groups.html">👥 Groups</a>
        <a href="/html/add-expense.html">💳 Expenses</a>
        <a href="/html/balance.html">⚖️ Balances</a>
        <a href="/html/settlement.html">🤝 Settlements</a>
        <a href="/html/reports.html">📊 Reports</a>
        <a href="/html/profile.html">👤 Profile</a>
        <a href="/logout">🚪 Logout</a>
    </nav>

</header>

<div class="container">

    <div class="page-title">

        <h2>👯 Group Members</h2>

        <p>
            Add people, remove people, keep the squad organised.
        </p>

    </div>

    <div id="message"
         class="message">
    </div>

    <div class="card">

        <div class="card-header">
            <h3>👥 Select Group</h3>
        </div>

        <div class="form-group">

            <label>Group</label>

            <select id="groupSelect"
                    onchange="groupChanged()">
            </select>

        </div>

    </div>

    <div class="card">

        <div class="card-header">
            <h3>➕ Add Member</h3>
        </div>

        <form id="addMemberForm">

            <div class="form-group">

                <label>User Email</label>

                <input type="email"
                       id="memberEmail"
                       placeholder="friend@mail.com"
                       required>

            </div>

            <button type="submit">
                Add Member
            </button>

        </form>

    </div>

    <div class="card">

        <div class="card-header">

            <h3>👯 Current Members</h3>

            <button onclick="loadMembers()">
                🔄 Refresh
            </button>

        </div>

        <table>

            <thead>

            <tr>
                <th>User ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Action</th>
            </tr>

            </thead>

            <tbody id="memberTable">
            </tbody>

        </table>

    </div>

</div>

<script src="/js/app.js"></script>

<script>

const groupSelect =
    document.getElementById(
        "groupSelect"
    );

const selectedGroup =
    localStorage.getItem(
        "selectedGroupId"
    );


function loadGroups() {

    fetch("/groups")

        .then(response => response.json())

        .then(groups => {

            groupSelect.innerHTML = "";

            groups.forEach(group => {

                const option =
                    document.createElement("option");

                option.value = group.id;

                option.textContent =
                    group.name
                    + " (ID: "
                    + group.id
                    + ")";

                if (
                    String(group.id)
                    === selectedGroup
                ) {

                    option.selected = true;
                }

                groupSelect.appendChild(option);

            });

            loadMembers();

        });
}


function groupChanged() {

    localStorage.setItem(
        "selectedGroupId",
        groupSelect.value
    );

    loadMembers();
}


function loadMembers() {

    const groupId =
        groupSelect.value;

    if (!groupId) {
        return;
    }

    fetch(
        "/group-members?groupId="
        + groupId
    )

        .then(response => response.json())

        .then(members => {

            const table =
                document.getElementById(
                    "memberTable"
                );

            table.innerHTML = "";

            members.forEach(member => {

                const row =
                    document.createElement("tr");

                row.innerHTML = `

                    <td>
                        #${member.user.id}
                    </td>

                    <td>
                        👤 ${member.user.name}
                    </td>

                    <td>
                        ${member.user.email}
                    </td>

                    <td>

                        <button class="button-danger"
                                onclick="removeMember(
                                    ${member.user.id}
                                )">

                            🗑️ Remove

                        </button>

                    </td>
                `;

                table.appendChild(row);

            });

        });
}


document.getElementById(
    "addMemberForm"
).addEventListener(
    "submit",
    function(event) {

        event.preventDefault();

        const data =
            new URLSearchParams();

        data.append(
            "groupId",
            groupSelect.value
        );

        data.append(
            "email",
            document.getElementById(
                "memberEmail"
            ).value
        );

        fetch(
            "/add-member",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/x-www-form-urlencoded"
                },

                body: data
            }
        )

            .then(response => response.text())

            .then(result => {

                showResultModal(
                    "👯 Add Member",
                    result
                );

                if (result.includes("successfully")) {

                    document.getElementById(
                        "memberEmail"
                    ).value = "";

                    loadMembers();
                }

            });

    }
);


function removeMember(userId) {

    const data =
        new URLSearchParams();

    data.append(
        "groupId",
        groupSelect.value
    );

    data.append(
        "userId",
        userId
    );

    fetch(
        "/remove-member",
        {
            method: "POST",

            headers: {
                "Content-Type":
                    "application/x-www-form-urlencoded"
            },

            body: data
        }
    )

        .then(response => response.text())

        .then(result => {

            showResultModal(
                "🗑️ Remove Member",
                result
            );

            if (result.includes("successfully")) {
                loadMembers();
            }

        });
}


loadGroups();

</script>

</body>
</html>
